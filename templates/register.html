{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card">
            <div class="card-header bg-success text-white">
                <h3>{% if current_user.is_admin %}Create New User{% else %}Register New Account{% endif %}</h3>
            </div>
            <div class="card-body">
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label">Username</label>
                        <input type="text" name="username" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" name="email" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Password</label>
                        <input type="password" name="password" class="form-control" required>
                        <small class="text-muted">Minimum 6 characters</small>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Confirm Password</label>
                        <input type="password" name="confirm_password" class="form-control" required>
                    </div>
                    {% if current_user.is_admin %}
                    <div class="mb-3 form-check">
                        <input type="checkbox" name="is_admin" class="form-check-input" value="true" id="isAdmin">
                        <label class="form-check-label" for="isAdmin">
                            👑 Grant Administrator Privileges
                        </label>
                    </div>
                    {% endif %}
                    <button type="submit" class="btn btn-primary">
                        {% if current_user.is_admin %}Create User{% else %}Register{% endif %}
                    </button>
                    <a href="{{ url_for('index') }}" class="btn btn-secondary">Cancel</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
