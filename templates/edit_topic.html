{% extends "base.html" %}
{% block content %}
<div class="container">
    <div class="card">
        <div class="card-header bg-success text-white">
            <h2>Add New Topic to: {{ category.name }}</h2>
        </div>
        <div class="card-body">
            <form method="POST">
                <div class="mb-3">
                    <label class="form-label fw-bold">Topic Name *</label>
                    <input type="text" name="name" class="form-control" required>
                </div>
                
                <div class="mb-3">
                    <label class="form-label fw-bold">Difficulty Level</label>
                    <select name="difficulty" class="form-select">
                        <option value="Beginner">🌱 Beginner</option>
                        <option value="Intermediate">📘 Intermediate</option>
                        <option value="Advanced">🚀 Advanced</option>
                    </select>
                </div>
                
                <div class="mb-3">
                    <label class="form-label fw-bold">Definition</label>
                    <textarea name="definition" class="form-control" rows="5"></textarea>
                </div>
                
                <div class="mb-3">
                    <label class="form-label fw-bold">Theory Notes</label>
                    <textarea name="theory_notes" class="form-control" rows="10"></textarea>
                </div>
                
                <div class="mb-3">
                    <label class="form-label fw-bold">Code Examples</label>
                    <textarea name="code_examples" class="form-control" rows="8"></textarea>
                </div>
                
                <div class="mb-3">
                    <label class="form-label fw-bold">Videos (One per line)</label>
                    <textarea name="videos" class="form-control" rows="3" placeholder="https://youtube.com/watch?v=..."></textarea>
                </div>
                
                <div class="mb-3">
                    <label class="form-label fw-bold">Images (One URL per line)</label>
                    <textarea name="images" class="form-control" rows="3" placeholder="https://example.com/image.jpg"></textarea>
                </div>
                
                <div class="mb-3">
                    <label class="form-label fw-bold">GitHub Links (One per line)</label>
                    <textarea name="github_links" class="form-control" rows="3" placeholder="https://github.com/user/repo"></textarea>
                </div>
                
                <div class="mb-3">
                    <label class="form-label fw-bold">Project Links (One per line)</label>
                    <textarea name="project_links" class="form-control" rows="3"></textarea>
                </div>
                
                <div class="mb-3">
                    <label class="form-label fw-bold">References (One per line)</label>
                    <textarea name="references" class="form-control" rows="3"></textarea>
                </div>
                
                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-success">💾 Save Topic</button>
                    <a href="{{ url_for('view_category', category_id=category.id) }}" class="btn btn-secondary">❌ Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
