{% extends "base.html" %}
{% block content %}
<h1>Add Topic to {{ category.name }}</h1>
<form method="POST">
    <div class="mb-3">
        <label class="form-label">Topic Name</label>
        <input type="text" name="name" class="form-control" required>
    </div>
    <div class="mb-3">
        <label class="form-label">Definition</label>
        <textarea name="definition" class="form-control" rows="5"></textarea>
    </div>
    <div class="mb-3">
        <label class="form-label">Theory Notes</label>
        <textarea name="theory_notes" class="form-control" rows="10"></textarea>
    </div>
    <div class="mb-3">
        <label class="form-label">Code Examples</label>
        <textarea name="code_examples" class="form-control" rows="8"></textarea>
    </div>
    <div class="mb-3">
        <label class="form-label">Videos (Embed YouTube/Vimeo links)</label>
        <textarea name="videos" class="form-control" rows="3"></textarea>
    </div>
    <div class="mb-3">
        <label class="form-label">Images/Diagrams URLs</label>
        <textarea name="images_diagrams" class="form-control" rows="3"></textarea>
    </div>
    <div class="mb-3">
        <label class="form-label">GitHub Links</label>
        <textarea name="github_links" class="form-control" rows="3"></textarea>
    </div>
    <div class="mb-3">
        <label class="form-label">Project Links</label>
        <textarea name="project_links" class="form-control" rows="3"></textarea>
    </div>
    <div class="mb-3">
        <label class="form-label">References</label>
        <textarea name="references" class="form-control" rows="3"></textarea>
    </div>
    <button type="submit" class="btn btn-primary">Save</button>
    <a href="{{ url_for('view_category', category_id=category.id) }}" class="btn btn-secondary">Cancel</a>
</form>
{% endblock %}
