{% extends "base.html" %}
{% block content %}
<div class="container">
    <div class="row">
        <div class="col-12">
            <div class="card">
                <div class="card-header bg-success text-white">
                    <h2>Add New Topic to: {{ category.name }}</h2>
                </div>
                <div class="card-body">
                    <form method="POST">
                        <div class="mb-3">
                            <label class="form-label fw-bold">Topic Name</label>
                            <input type="text" name="name" class="form-control" required>
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label fw-bold">Definition</label>
                            <textarea name="definition" class="form-control" rows="5" placeholder="Enter the definition..."></textarea>
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label fw-bold">Theory Notes</label>
                            <textarea name="theory_notes" class="form-control" rows="10" placeholder="Enter your theory notes..."></textarea>
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label fw-bold">Code Examples</label>
                            <textarea name="code_examples" class="form-control" rows="8" placeholder="Paste your code examples..."></textarea>
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label fw-bold">Videos</label>
                            <textarea name="videos" class="form-control" rows="3" placeholder="YouTube links, embedded code, etc."></textarea>
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label fw-bold">Images/Diagrams</label>
                            <textarea name="images_diagrams" class="form-control" rows="3" placeholder="Image URLs or markdown"></textarea>
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label fw-bold">GitHub Links</label>
                            <textarea name="github_links" class="form-control" rows="3" placeholder="Repository URLs"></textarea>
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label fw-bold">Project Links</label>
                            <textarea name="project_links" class="form-control" rows="3" placeholder="Project demos, articles"></textarea>
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label fw-bold">References</label>
                            <textarea name="references" class="form-control" rows="3" placeholder="Books, papers, citations"></textarea>
                        </div>
                        
                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-success">➕ Save Topic</button>
                            <a href="{{ url_for('view_category', category_id=category.id) }}" class="btn btn-secondary">❌ Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
