{% extends "base.html" %}
{% block content %}
<div class="container">
    <div class="card">
        <div class="card-header bg-success text-white">
            <h2>Add New Topic to: {{ category.name }}</h2>
        </div>
        <div class="card-body">
            <!-- CRITICAL: enctype must be here for file uploads -->
            <form method="POST" enctype="multipart/form-data">
                <div class="mb-3">
                    <label class="form-label">Topic Name *</label>
                    <input type="text" name="name" class="form-control" required>
                </div>
                
                <div class="mb-3">
                    <label class="form-label">Difficulty Level</label>
                    <select name="difficulty" class="form-select">
                        <option value="Beginner">Beginner</option>
                        <option value="Intermediate">Intermediate</option>
                        <option value="Advanced">Advanced</option>
                    </select>
                </div>
                
                <div class="mb-3">
                    <label class="form-label">Definition</label>
                    <textarea name="definition" class="form-control" rows="5"></textarea>
                </div>
                
                <div class="mb-3">
                    <label class="form-label">Theory Notes</label>
                    <textarea name="theory_notes" class="form-control" rows="8"></textarea>
                </div>
                
                <div class="mb-3">
                    <label class="form-label">Code Examples</label>
                    <textarea name="code_examples" class="form-control" rows="8"></textarea>
                </div>
                
                <div class="mb-3">
                    <label class="form-label">Videos (YouTube URLs)</label>
                    <textarea name="videos" class="form-control" rows="3"></textarea>
                </div>
                
                <div class="mb-3">
                    <label class="form-label">Images (URLs)</label>
                    <textarea name="images" class="form-control" rows="3"></textarea>
                </div>
                
                <div class="mb-3">
                    <label class="form-label">GitHub Links</label>
                    <textarea name="github_links" class="form-control" rows="3"></textarea>
                </div>
                
                <div class="mb-3">
                    <label class="form-label">Project Links</label>
                    <textarea name="project_links" class="form-control" rows="3"></textarea>
                </div>
                
                <div class="mb-3">
                    <label class="form-label">References</label>
                    <textarea name="references" class="form-control" rows="3"></textarea>
                </div>
                
                <div class="mb-3">
                    <label class="form-label">Upload Documents (PDF, DOC, etc.)</label>
                    <input type="file" name="documents" class="form-control" multiple>
                    <small class="text-muted">Max 50MB per file</small>
                </div>
                
                <button type="submit" class="btn btn-primary">Save Topic</button>
                <a href="{{ url_for('view_category', category_id=category.id) }}" class="btn btn-secondary">Cancel</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
